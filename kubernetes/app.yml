apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatapp
  labels:
    app: chatapp

spec:
  replicas: 3
  selector:
    matchLabels:
      app: chatapp
  
  template:
    metadata:
      labels:
        app: chatapp
    
    spec:
      containers:
      - name: chatapp
        image: shahil050/chatapp:latest
        envFrom:
        - secretRef:
            name: chatbot-secrets
        imagePullPolicy: Always
        ports:
        - containerPort: 7860


  